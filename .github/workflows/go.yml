name: Go

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/go.yml
      - .trust.toml
      - .specsync/**
      - fledge.toml
      - .github/workflows/trust.yml
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/go.yml
      - .trust.toml
      - .specsync/**
      - fledge.toml
      - .github/workflows/trust.yml

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"
